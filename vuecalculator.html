<style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #d2d2d2;
            font-family: Arial, Helvetica, sans-serif;
            flex-direction: column;
        }

        h2{
            color: #000000;
            font-size: 50px;
        }

        .calculator {
            background-color: #ffffff;
            padding: 20px;
            width: 280px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            border: 2px solid black;
        }

        #display {
            width: 100%;
            height: 55px;
            background-color: #ffffff;
            color: #000000;
            border: 1px solid black;
            border-radius: 8px;
            font-size: 26px;
            text-align: right;
            padding: 10px;
            margin-bottom: 15px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            height: 52px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background-color: #2d2d2d;
            color: #fff;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #aaaaaa;
        }

        button:active {
            transform: scale(0.95);
        }

        /* Operators */
        button:nth-child(2),
        button:nth-child(3),
        button:nth-child(4),
        button:nth-child(8) {
            background-color: #ff9500;
        }

        button:nth-child(2) {
            font-weight: bolder;
            font-size: larger;
        }

        button:nth-child(16) {
            background-color: rgb(6, 80, 6);
        }

        button:nth-child(16):hover {
            background-color: rgb(66, 84, 74);
        }

        button:nth-child(2):hover,
        button:nth-child(3):hover,
        button:nth-child(4):hover,
        button:nth-child(8):hover {
            background-color: #554326;
        }


        button:first-child {
            background-color: #a70e06;
        }

        button:first-child:hover {
            background-color: #3a100d;
        }

    </style>
</head>
<body>
    <h2>Calculator</h2>
    
    <div id="app" class="calculator">
        
        <input type="text" id="display" :value="display" readonly>
        <div class="buttons">
            <button @click="clearAll()">C</button>
            <button @click="setOperator('/')">÷</button>
            <button @click="setOperator('*')">x</button>
            <button @click="setOperator('-')">-</button>

            <button @click="appendNumber(7)">7</button>
            <button @click="appendNumber(8)">8</button>
            <button @click="appendNumber(9)">9</button>
            <button @click="setOperator('+')">+</button>

            <button @click="appendNumber(4)">4</button>
            <button @click="appendNumber(5)">5</button>
            <button @click="appendNumber(6)">6</button>

            <button @click="appendNumber(0)">0</button>
            <button @click="appendNumber(2)">2</button>
            <button @click="appendNumber(3)">3</button>

            <button @click="appendNumber(1)">1</button>
            <button @click="calculate()">=</button>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const app = Vue.createApp({
            data(){
                return {
                    display: "",
                    total: "",
                    currentNumber: "",
                    operator: "",
                }
            },

            methods:{
                appendNumber(num){
                    this.currentNumber += num;
                    this.display += num;
                },

                setOperator(op){
                    if(this.currentNumber === "") return;
                    this.calculateRunningTotal();
                    this.operator = op;
                    this.display += op
                },

                calculateRunningTotal(){
                    let num = parseFloat(this.currentNumber);
                    if(this.operator === ""){
                        this.total = num;
                    } 
                    else {
                        switch(this.operator){
                            case "+": this.total += num; 
                            break;
                            case "-": this.total -= num; 
                            break;
                            case "*": this.total *= num; 
                            break;
                            case "/": this.total = num !== 0 ? this.total / num : "Infinite";
                            break;
                        }
                    }
                    this.currentNumber = "";
                },
                calculate(){
                    if(this.currentNumber === "") return;
                    this.calculateRunningTotal();
                    this.display = this.total;
                    this.currentNumber = this.total.toString();
                    this.total = 0;
                    this.operator = "";
                },
                
                clearAll() {
                    this.display = "";
                    this.currentNumber = "";
                    this.total = 0;
                    this.operator = "";
                }
            }
        })
        app.mount('#app')
    </script>
</body>
</html>
